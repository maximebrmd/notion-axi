# Keep this filename: npm trusted publishers are bound to a workflow filename.
name: Release (Changesets)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run build:skill -- --check
      - run: pnpm run lint
      - run: pnpm run format:check
      - run: pnpm test

      # npm >= 11.5.1 supports trusted publishing; keep the install on Node 24's
      # compatible npm major. No registry auth token is needed with OIDC.
      - run: npm install --global npm@11

      - name: Create release PR or publish
        id: changesets
        uses: changesets/action@v2
        with:
          version-script: pnpm run version-packages
          publish-script: pnpm run release
          commit-message: "chore: release notion-axi"
          pr-title: "chore: release notion-axi"
          create-github-releases: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          NPM_CONFIG_PROVENANCE: "true"
          PNPM_CONFIG_PROVENANCE: "true"

      - name: Verify published release
        if: steps.changesets.outputs.has-changesets == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_version="$(node -p "require('./package.json').version")"
          npm view "notion-axi@${release_version}" version --registry https://registry.npmjs.org
          gh release view "v${release_version}" --repo "${GITHUB_REPOSITORY}" --json tagName --jq .tagName
