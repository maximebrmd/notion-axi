name: Guard generated files

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: guard-generated-files-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: Generated files must not be hand-edited
    runs-on: ubuntu-latest
    # Changesets owns CHANGELOG.md; its release PR is opened by github-actions.
    if: github.event.pull_request.user.login != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          # Need history on both sides of the merge-base so `git diff base...head`
          # reflects exactly what GitHub shows as "Files changed".
          fetch-depth: 0

      - name: Check PR does not modify the generated changelog
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          files=$(git diff --name-only "${BASE_SHA}...${HEAD_SHA}")

          violated=""
          for generated_file in CHANGELOG.md; do
            if printf '%s\n' "$files" | grep -qxF -- "$generated_file"; then
              violated="${violated} ${generated_file}"
            fi
          done

          if [ -n "$violated" ]; then
            {
              echo "::error::This PR modifies Changesets-generated files:${violated}"
              echo
              echo "CHANGELOG.md is auto-generated by Changesets. Do not hand-edit it."
              echo
              echo "If you want your change to appear in the next release notes, use a"
              echo "changeset created with 'pnpm changeset'. The release workflow will"
              echo "update the changelog in the next release PR automatically."
              echo
              echo "See CONTRIBUTING.md for the full contributor workflow."
            } >&2
            exit 1
          fi

          echo "No Changesets-generated files modified. OK."
